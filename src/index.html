    <script>
      try {
        const storedMode = localStorage.getItem('theme.mode');
        // Graphite & Ivory: dark is the default look, light (ivory) only when the visitor picked it.
        const preferredMode = storedMode === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-mode', preferredMode);
      } catch {}
    </script>
