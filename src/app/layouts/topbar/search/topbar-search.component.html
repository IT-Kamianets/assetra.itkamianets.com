<button
	class="theme-interactive theme-focus inline-flex h-10 w-10 items-center sm:h-11 sm:w-11 justify-center rounded-full border border-[var(--c-topbar-border)] text-[var(--c-topbar-text)] hover:bg-[var(--c-topbar-hover)] lg:hidden"
	type="button"
	aria-label="Пошук моделей"
	[attr.aria-expanded]="mobileOpen()"
	(click)="mobileOpen() ? close() : openMobile()"
>
	<span class="material-symbols-outlined text-[22px]" aria-hidden="true">search</span>
</button>

<form
	class="fixed inset-x-3 top-[5.25rem] z-50 rounded-3xl border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-3 shadow-[var(--shadow-md)] lg:static lg:block lg:rounded-none lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none"
	[class.hidden]="!mobileOpen()"
	role="search"
	(submit)="submit($event)"
>
	<label class="relative block">
		<span class="sr-only">Пошук моделей</span>
		<span
			class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-[var(--c-text-muted)] lg:text-[#414638]"
			aria-hidden="true"
		>
			search
		</span>
		<input
			#input
			class="theme-focus h-11 w-full rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] pl-10 pr-4 text-sm text-[var(--c-text-strong)] placeholder:text-[var(--c-text-muted)] lg:h-10 lg:w-56 lg:border-transparent lg:bg-[#d9d5c7] lg:text-[#2f3328] lg:placeholder:text-[#5f6453] xl:w-72 [&::-webkit-search-cancel-button]:appearance-none"
			type="search"
			placeholder="Пошук моделей…"
			autocomplete="off"
			[value]="query()"
			(input)="query.set($any($event.target).value)"
			(focus)="focused.set(true)"
		/>
	</label>

	@if (showResults()) {
		<div
			class="mt-2 overflow-hidden rounded-2xl border border-[var(--c-border)] bg-[var(--c-bg-secondary)] lg:absolute lg:right-0 lg:top-full lg:w-96 lg:shadow-[var(--shadow-md)]"
		>
			@if (suggestions().length) {
				<ul aria-label="Знайдені моделі">
					@for (item of suggestions(); track item.slug) {
						<li>
							<a
								class="theme-focus flex items-center gap-3 px-3 py-2 hover:bg-[var(--c-bg-tertiary)]"
								[routerLink]="['/product', item.slug]"
								(click)="pick()"
							>
								<img
									class="h-12 w-12 shrink-0 rounded-[var(--radius)] object-cover"
									[src]="item.thumb"
									alt=""
									width="48"
									height="48"
									loading="lazy"
								/>
								<span class="min-w-0 flex-1">
									<span class="block truncate text-sm font-semibold text-[var(--c-text-strong)]">{{ item.title }}</span>
									<span class="block text-xs text-[var(--c-text-muted)]">{{ item.category }}</span>
								</span>
								<span class="shrink-0 text-sm font-semibold text-[var(--c-text-strong)]">{{ item.price }}</span>
							</a>
						</li>
					}
				</ul>
				<button
					class="theme-focus flex w-full items-center justify-between border-t border-[var(--c-border)] px-3 py-3 text-sm font-semibold text-[var(--c-primary)] hover:bg-[var(--c-bg-tertiary)]"
					type="submit"
				>
					Усі результати ({{ matches().length }})
					<span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span>
				</button>
			} @else {
				<p class="px-4 py-5 text-sm text-[var(--c-text-muted)]">Нічого не знайдено за запитом «{{ query().trim() }}».</p>
			}
		</div>
	}
</form>
