<footer class="border-t border-[var(--c-topbar-border)] bg-[var(--c-topbar-bg)] text-[#f7f5ef] backdrop-blur-2xl backdrop-saturate-[1.8]">
	<div class="mx-auto grid max-w-[var(--container)] gap-10 px-4 py-10 sm:px-6 lg:grid-cols-[minmax(0,1.4fr)_minmax(14rem,0.8fr)] lg:gap-16">
		<div class="grid gap-5 sm:grid-cols-[7rem_minmax(0,1fr)] sm:items-start">
			<div
				class="w-28 overflow-hidden rounded-full"
			>
				<img
					class="h-auto w-full rounded-full"
					width="112"
					height="112"
					[src]="companyImage()"
					[translate]="{ alt: companyImageAlt() }"
					loading="lazy"
					decoding="async"
				/>
			</div>

			<div>
				<p
					class="text-sm font-semibold uppercase tracking-[0.2em] text-[var(--c-topbar-text)]/80"
					translate
				>
					About company
				</p>
				@if (company().name) {
					<p class="mt-3 text-xl font-semibold">
						{{ company().name }}
					</p>
				}
				<p class="mt-3 max-w-2xl text-sm leading-7 text-[var(--c-topbar-text)]/85">
					{{ company().description }}
				</p>
			</div>
		</div>

		<div class="flex flex-col gap-4">
			<p
				class="text-sm font-semibold uppercase tracking-[0.2em] text-[var(--c-topbar-text)]/80"
				translate
			>
				Pages
			</p>
			<nav [translate]="{ ariaLabel: 'Pages footer navigation' }">
				<ul class="grid grid-cols-2 gap-x-6 gap-y-3">
					@for (page of pageLinks; track page.path) {
						<li>
							<a
								class="theme-focus inline-flex rounded-md text-base font-medium text-[var(--c-topbar-text)] underline-offset-4 transition-opacity duration-150 hover:underline hover:opacity-80"
								[routerLink]="page.path"
							>
								{{ page.label }}
							</a>
						</li>
					}
				</ul>
			</nav>
		</div>
	</div>

	<div class="border-t border-[var(--c-topbar-border)]">
		<div class="mx-auto flex max-w-[var(--container)] px-4 py-4 text-sm text-[var(--c-topbar-text)]/80 sm:px-6">
			<p>
				&copy; {{ currentYear }} {{ company().name || company().title }}.
				<span translate>All rights reserved.</span>
			</p>
		</div>
	</div>
</footer>
